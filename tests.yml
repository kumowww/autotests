import pytest

from pages.inventory_page import InventoryPage
from pages.login_page import LoginPage


def test_valid_user_sees_products(driver):
    LoginPage(driver).open().login("standard_user", "secret_sauce")
    assert InventoryPage(driver).title() == "Products"


def test_locked_out_user_sees_error(driver):
    login_page = LoginPage(driver).open().login("locked_out_user", "secret_sauce")
    assert "locked out" in login_page.error_text()


@pytest.mark.parametrize(
    "username, password",
    [
        ("standard_user", "wrong_password"),
        ("", "secret_sauce"),
    ],
)
def test_invalid_credentials_show_error(driver, username, password):
    login_page = LoginPage(driver).open().login(username, password)
    assert login_page.error_text().startswith("Epic sadface")
